name: ARMCO OIL automatic sales

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-sell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process due automatic oil sales
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://oil-silk.vercel.app' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "Missing repository Actions secret: CRON_SECRET"
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/auto-sell")"
          echo "$response"
